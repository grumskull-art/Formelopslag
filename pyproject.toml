[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "formelopslag"
version = "0.1.0"
description = "Offline, kildebaseret formelopslag til EL og TM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["matplotlib==3.10.6", "Pillow==12.0.0"]

[project.scripts]
formelopslag = "formula_lookup.cli:main"

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
formula_lookup = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
