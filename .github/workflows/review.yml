name: Review Formelopslag

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate and preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: formelopslag validate
      - run: python -m pytest -q
      - run: formelopslag build
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node test_browser.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright
      - uses: actions/upload-artifact@v4
        with:
          name: formelopslag-preview-${{ github.event.pull_request.head.sha || github.sha }}
          path: docs/index.html
          if-no-files-found: error
          retention-days: 14
